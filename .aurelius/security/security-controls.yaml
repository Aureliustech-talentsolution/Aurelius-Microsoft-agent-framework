    compliance: ".aurelius/evidence/compliance/"
    audit_logs: ".aurelius/evidence/audit/"

  retention:
    sbom: "7 years"
    security_scans: "3 years"
    test_reports: "3 years"
    compliance: "7 years"
    audit_logs: "10 years"  # Federal requirement

