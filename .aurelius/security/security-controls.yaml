# Aurelius Security Controls Mapping
# CMMC Level 2 / NIST 800-171 Implementation

version: "1.0.0"
date: "2025-10-13"
classification: "Unclassified // Technical"
scope: "Microsoft Agent Framework - Aurelius Implementation"

# ==============================================================================
# ACCESS CONTROL (AC) - Domain 1
# ==============================================================================

access_control:
  AC.1.001:
    title: "Limit information system access to authorized users"
    implementation:
      - Microsoft Entra ID (Azure AD) authentication
      - OAuth 2.0 + OIDC for API access
      - Role-Based Access Control (RBAC)
      - Just-in-time (JIT) access for privileged operations
    evidence:
      - auth-flow-diagram.md
      - rbac-matrix.xlsx
      - access-logs.json
    status: implemented

  AC.1.002:
    title: "Limit information system access to types of transactions"
    implementation:
      - API Gateway with path-based routing
      - Middleware for transaction validation
      - Audit logging of all transactions
    evidence:
      - api-gateway-config.yaml
      - transaction-audit-logs.json
    status: implemented

  AC.2.007:
    title: "Employ the principle of least privilege"
    implementation:
      - Minimum required permissions for service accounts
      - Managed identities for Azure resources
      - Temporary elevated access only when needed
    evidence:
      - service-principal-permissions.json
      - managed-identity-config.yaml
    status: implemented

  AC.2.013:
    title: "Monitor and control remote access sessions"
    implementation:
      - Azure Bastion for secure remote access
      - VPN with MFA for remote developers
      - Session logging and timeout (15 minutes)
    evidence:
      - bastion-config.yaml
      - vpn-access-logs.json
    status: implemented

# ==============================================================================
# IDENTIFICATION AND AUTHENTICATION (IA) - Domain 2
# ==============================================================================

identification_authentication:
  IA.1.076:
    title: "Identify information system users"
    implementation:
      - Microsoft Entra ID user directory
      - Unique user identifiers (UPN)
      - User lifecycle management
    evidence:
      - entra-id-config.yaml
      - user-directory-export.csv
    status: implemented

  IA.1.077:
    title: "Authenticate users"
    implementation:
      - Microsoft Entra ID authentication
      - OAuth 2.0 tokens with expiration
      - PIV/CAC certificate authentication (federal)
    evidence:
      - auth-implementation.md
      - piv-cac-config.yaml
    status: implemented

  IA.2.078:
    title: "Enforce a minimum password complexity"
    implementation:
      - Entra ID password policy (12+ characters, complexity required)
      - Passwordless authentication preferred (FIDO2, Windows Hello)
    evidence:
      - password-policy.json
    status: implemented

  IA.2.079:
    title: "Prohibit password reuse"
    implementation:
      - Entra ID password history (24 passwords)
      - Leaked password detection
    evidence:
      - password-policy.json
    status: implemented

  IA.2.081:
    title: "Store and transmit only cryptographically-protected passwords"
    implementation:
      - No password storage in application
      - Azure Key Vault for service credentials
      - Managed identities eliminate passwords where possible
    evidence:
      - key-vault-config.yaml
      - managed-identity-usage.md
    status: implemented

# ==============================================================================
# SYSTEM AND COMMUNICATIONS PROTECTION (SC) - Domain 3
# ==============================================================================

system_communications_protection:
  SC.3.177:
    title: "Employ FIPS-validated cryptography"
    implementation:
      - TLS 1.3 with FIPS 140-2 approved ciphers
      - AES-256-GCM for data at rest
      - Azure Key Vault FIPS 140-2 Level 2 validated
    evidence:
      - tls-config.yaml
      - encryption-config.md
      - fips-validation-cert.pdf
    status: implemented

  SC.3.185:
    title: "Implement cryptographic mechanisms"
    implementation:
      - TLS 1.3 for all network traffic
      - AES-256-GCM for data at rest encryption
      - RSA-4096 for key exchange
      - SHA-384 for hashing
    evidence:
      - crypto-implementation.md
      - cipher-suite-config.yaml
    status: implemented

  SC.3.191:
    title: "Protect confidentiality of CUI at rest"
    implementation:
      - Azure Storage encryption at rest (AES-256)
      - Azure Cosmos DB always encrypted
      - Transparent Data Encryption (TDE) for SQL
    evidence:
      - storage-encryption-config.yaml
      - cosmos-encryption-config.json
    status: implemented

# ==============================================================================
# AUDIT AND ACCOUNTABILITY (AU) - Domain 4
# ==============================================================================

audit_accountability:
  AU.3.046:
    title: "Alert in the event of an audit logging process failure"
    implementation:
      - Azure Monitor alerts for log failures
      - PagerDuty escalation for critical audit failures
      - Backup logging to secondary destination
    evidence:
      - alert-rules.yaml
      - pagerduty-integration.md
    status: implemented

  AU.3.049:
    title: "Protect audit information and tools from unauthorized access"
    implementation:
      - Audit logs in append-only Azure Cosmos DB
      - RBAC restrictions on audit log access
      - Separate security logging storage account
    evidence:
      - audit-log-rbac.json
      - cosmos-db-config.yaml
    status: implemented

  AU.3.051:
    title: "Correlate audit record review, analysis, and reporting"
    implementation:
      - Azure Sentinel SIEM for correlation
      - OpenTelemetry for distributed tracing
      - Automated anomaly detection
    evidence:
      - sentinel-workbook.json
      - correlation-rules.yaml
    status: implemented

# ==============================================================================
# INCIDENT RESPONSE (IR) - Domain 5
# ==============================================================================

incident_response:
  IR.2.093:
    title: "Detect and respond to events"
    implementation:
      - Azure Sentinel for threat detection
      - Automated incident response playbooks
      - Security operations center (SOC) integration
    evidence:
      - sentinel-analytics-rules.yaml
      - incident-response-playbooks.json
    status: implemented

  IR.3.098:
    title: "Establish incident handling capability"
    implementation:
      - Documented incident response plan
      - Incident response team with on-call rotation
      - Regular tabletop exercises (quarterly)
    evidence:
      - incident-response-plan.md
      - tabletop-exercise-reports/
    status: implemented

# ==============================================================================
# MEDIA PROTECTION (MP) - Domain 6
# ==============================================================================

media_protection:
  MP.2.120:
    title: "Protect CUI during transport"
    implementation:
      - TLS 1.3 for all network transport
      - Certificate pinning for critical APIs
      - Encrypted file transfer protocols only
    evidence:
      - transport-security-config.yaml
      - cert-pinning-config.json
    status: implemented

  MP.3.124:
    title: "Mark media with CUI markings"
    implementation:
      - Automated CUI banner/footer application
      - Metadata tagging for all CUI documents
      - Azure Information Protection labels
    evidence:
      - cui-marking-automation.py
      - aip-label-policy.json
    status: implemented

  MP.3.125:
    title: "Prohibit the use of portable storage devices"
    implementation:
      - Endpoint DLP policies via Microsoft Intune
      - USB device restrictions
      - Cloud-only storage (Azure Blob, OneDrive)
    evidence:
      - intune-policy.json
      - dlp-rules.yaml
    status: implemented

# ==============================================================================
# RISK ASSESSMENT (RA) - Domain 7
# ==============================================================================

risk_assessment:
  RA.3.161:
    title: "Monitor organizations and information systems"
    implementation:
      - Azure Security Center continuous assessment
      - Microsoft Defender for Cloud
      - Quarterly vulnerability scans
    evidence:
      - security-center-dashboard.png
      - vulnerability-scan-reports/
    status: implemented

  RA.3.163:
    title: "Scan for vulnerabilities"
    implementation:
      - Daily automated dependency scans (Dependabot, Renovate)
      - Weekly SAST scans (Semgrep, Bandit)
      - Monthly DAST scans (OWASP ZAP)
      - Quarterly penetration testing
    evidence:
      - dependency-scan-results/
      - sast-scan-results/
      - dast-scan-reports/
      - pentest-reports/
    status: implemented

# ==============================================================================
# SYSTEM AND INFORMATION INTEGRITY (SI) - Domain 8
# ==============================================================================

system_information_integrity:
  SI.3.218:
    title: "Protect the authenticity of communications sessions"
    implementation:
      - Mutual TLS (mTLS) for service-to-service
      - Certificate-based authentication
      - Session token validation
    evidence:
      - mtls-config.yaml
      - cert-auth-implementation.md
    status: implemented

  SI.3.219:
    title: "Protect the integrity of transmitted information"
    implementation:
      - TLS 1.3 with integrity protection
      - HMAC for message integrity
      - Digital signatures for critical data
    evidence:
      - tls-integrity-config.yaml
      - hmac-implementation.py
    status: implemented

# ==============================================================================
# SECURE SOFTWARE DEVELOPMENT FRAMEWORK (SSDF)
# ==============================================================================

secure_software_development:
  PO.1:
    title: "Define and document secure development practices"
    implementation:
      - PRD.md with security requirements
      - ARCHITECTURE.md with security controls
      - CLAUDE.md with development standards
      - This security-controls.yaml file
    evidence:
      - .aurelius/PRD.md
      - .aurelius/ARCHITECTURE.md
      - .aurelius/CLAUDE.md
      - .aurelius/security/security-controls.yaml
    status: implemented

  PS.1:
    title: "Protect all components of software"
    implementation:
      - All dependencies pinned in pyproject.toml
      - SBOM generation (CycloneDX)
      - License compliance scanning
      - Private package repositories
    evidence:
      - pyproject.toml
      - .aurelius/evidence/sbom/
      - .aurelius/evidence/compliance/licenses.json
    status: implemented

  PW.4:
    title: "Review and/or analyze code"
    implementation:
      - Pre-commit hooks (linting, type checking, security)
      - Required code review (minimum 2 approvals)
      - Automated SAST in CI/CD pipeline
      - Security review for sensitive changes
    evidence:
      - .pre-commit-config.yaml
      - .github/workflows/ci.yaml
      - CONTRIBUTING.md
    status: implemented

  RV.1:
    title: "Identify vulnerabilities and remediate"
    implementation:
      - Daily dependency vulnerability scans
      - SLA: Critical vulnerabilities patched within 24 hours
      - High vulnerabilities patched within 7 days
      - Vulnerability disclosure program
    evidence:
      - .github/workflows/security-scan.yaml
      - vulnerability-remediation-sla.md
    status: implemented

  RV.3:
    title: "Analyze identified vulnerabilities"
    implementation:
      - Root cause analysis for all vulnerabilities
      - Lessons learned documented in ADRs
      - Security retrospectives after incidents
    evidence:
      - docs/decisions/security/
      - incident-postmortems/
    status: implemented

# ==============================================================================
# CONTINUOUS MONITORING
# ==============================================================================

continuous_monitoring:
  metrics:
    - name: "Failed authentication attempts"
      threshold: "> 10 in 5 minutes"
      action: "Lock account, alert SOC"

    - name: "Unauthorized access attempts"
      threshold: "> 5 in 10 minutes"
      action: "Alert SOC, investigate"

    - name: "CUI data access"
      threshold: "All accesses"
      action: "Log to audit trail"

    - name: "Privileged operation"
      threshold: "All operations"
      action: "Require MFA, log to audit trail"

    - name: "Security vulnerability detected"
      threshold: "Critical or High"
      action: "Create incident, notify security team"

  review_schedule:
    daily:
      - Security alerts review
      - Vulnerability scan results
      - Access logs anomalies

    weekly:
      - Access control review
      - Security posture assessment
      - Incident response metrics

    monthly:
      - Compliance attestation
      - Security control effectiveness review
      - Risk assessment update

    quarterly:
      - Full security audit
      - Penetration testing
      - Disaster recovery drill
      - Compliance certification review

