# Aurelius Pre-Commit Configuration
# This configuration enforces federal compliance and security standards

repos:
  # General file checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--safe]
      - id: check-json
      - id: check-toml
      - id: check-added-large-files
        args: [--maxkb=1000]
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: detect-private-key
        name: Detect Private Keys (CRITICAL)
      - id: mixed-line-ending
        args: [--fix=lf]

  # Secrets detection (CMMC requirement)
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.4.0
    hooks:
      - id: detect-secrets
        name: Detect Secrets (CMMC SC.3.177)
        args: ['--baseline', '.secrets.baseline']
        exclude: package.lock.json

  # Python: Black formatter
  - repo: https://github.com/psf/black
    rev: 24.1.1
    hooks:
      - id: black
        language_version: python3.10
        args: [--line-length=120]

  # Python: isort import sorting
  - repo: https://github.com/PyCQA/isort
    rev: 5.13.2
    hooks:
      - id: isort
        args: [--profile=black, --line-length=120]

  # Python: Ruff linter (replaces flake8, pylint)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.2.1
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
        name: Ruff Linter

  # Python: MyPy static type checking
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.8.0
    hooks:
      - id: mypy
        name: MyPy Type Checker (Strict Mode)
        args: [--strict, --ignore-missing-imports]
        additional_dependencies:
          - types-requests
          - types-PyYAML
          - pydantic

  # Python: Bandit security linter (SSDF requirement)
  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.7
    hooks:
      - id: bandit
        name: Bandit Security Scan (SSDF PO.1)
        args: [-c, pyproject.toml, -r, .]
        exclude: ^tests/

  # Python: Safety vulnerability checker
  - repo: https://github.com/Lucas-C/pre-commit-hooks-safety
    rev: v1.3.3
    hooks:
      - id: python-safety-dependencies-check
        name: Safety Vulnerability Check (SSDF RV.1)
        files: pyproject.toml

  # Pytest runner
  - repo: local
    hooks:
      - id: pytest-check
        name: Run Pytest (80% Coverage Required)
        entry: pytest
        args: [--cov, --cov-fail-under=80, -q]
        language: system
        pass_filenames: false
        always_run: true
        stages: [commit]

  # SBOM generation (federal compliance)
  - repo: local
    hooks:
      - id: generate-sbom
        name: Generate SBOM (Federal Requirement)
        entry: bash -c 'cyclonedx-py -o .aurelius/evidence/sbom/sbom-$(date +%Y%m%d).json || true'
        language: system
        pass_filenames: false
        always_run: false
        stages: [manual]

  # License compliance check
  - repo: local
    hooks:
      - id: license-check
        name: License Compliance Check
        entry: bash -c 'pip-licenses --format=json --output-file=.aurelius/evidence/compliance/licenses-$(date +%Y%m%d).json || true'
        language: system
        pass_filenames: false
        always_run: false
        stages: [manual]

  # Commit message validation
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v3.0.0
    hooks:
      - id: conventional-pre-commit
        name: Conventional Commit Format
        stages: [commit-msg]
        args: [feat, fix, docs, test, security, compliance, refactor, chore]

  # YAML linting
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.35.1
    hooks:
      - id: yamllint
        args: [-c=.yamllint]

  # Markdown linting
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.39.0
    hooks:
      - id: markdownlint
        args: [--fix]

  # Dockerfile linting
  - repo: https://github.com/hadolint/hadolint
    rev: v2.12.0
    hooks:
      - id: hadolint-docker
        name: Hadolint Dockerfile Linter

# CI-specific hooks (run in GitHub Actions)
ci:
  autofix_commit_msg: |
    style: auto-fix from pre-commit hooks

    [evidence: .pre-commit-config.yaml]
  autofix_prs: true
  autoupdate_branch: ''
  autoupdate_commit_msg: 'chore: update pre-commit hooks'
  autoupdate_schedule: weekly
  skip: []
  submodules: false
